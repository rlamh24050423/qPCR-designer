<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="qPCR Plate">

<title>qPCR 96-Well Plate Designer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px;
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
}

.container {
    max-width: 1200px;
    margin: auto;
}

h1 {
    margin-top: 0;
    margin-bottom: 20px;
}

.panel,
.experiment-panel,
.plate-panel,
.legend {
    background: white;
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

/* =========================================
   PLATE NAVIGATION
========================================= */

.plate-navigation {
    background: white;
    border-radius: 12px;
    padding: 12px 18px;
    margin-bottom: 16px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.plate-nav-left {
    display: flex;
    align-items: center;
    gap: 8px;
}

.plate-nav-btn {
    width: 38px;
    height: 38px;
    padding: 0;

    border: 1px solid #d1d5db;
    background: #f8f9fa;

    border-radius: 7px;

    font-size: 18px;
    cursor: pointer;
}

.plate-nav-btn:hover {
    background: #e9ecef;
}

.add-plate-btn {
    background: #2563eb;
    color: white;
    border: none;
    font-weight: bold;
}

.add-plate-btn:hover {
    background: #1d4ed8;
}

.delete-plate-btn {
    background: #dc2626;
    color: white;
    border: none;

    padding: 9px 14px;
    border-radius: 7px;
    cursor: pointer;
}

.delete-plate-btn:disabled {
    opacity: 0.4;
    cursor: default;
}

.plate-counter {
    min-width: 100px;
    text-align: center;
    font-weight: bold;
    font-size: 14px;
}

/* =========================================
   EXPERIMENT INFO
========================================= */

.experiment-panel {
    margin-bottom: 18px;
}

.experiment-panel h2 {
    margin-top: 0;
    margin-bottom: 12px;
}

.experiment-grid {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 15px;
}

.field-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.field-group label {
    font-size: 13px;
    font-weight: bold;
}

.field-group input,
.field-group textarea {
    width: 100%;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 10px;
    font-family: Arial, sans-serif;
    font-size: 14px;
}

.field-group textarea {
    min-height: 72px;
    resize: vertical;
}

/* =========================================
   SAMPLE / GENE
========================================= */

.top-panel {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-bottom: 20px;
}

.panel h2,
.plate-panel h2 {
    margin-top: 0;
}

.input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
}

.input-row input {
    flex: 1;
    min-width: 0;
    padding: 9px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

button {
    font-family: Arial, sans-serif;
}

.add-btn {
    padding: 9px 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;

    background: #333;
    color: white;
}

/* =========================================
   SAMPLE / GENE ITEMS
========================================= */

.list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.list-item {
    position: relative;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-height: 36px;

    padding: 7px 28px 7px 12px;

    border-radius: 7px;

    cursor: pointer;

    background: #eee;

    border: 3px solid transparent;

    user-select: none;

    font-size: 14px;
    font-weight: bold;
}

.list-item:hover {
    transform: translateY(-1px);
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
}

/* DELETE X */

.delete-item {
    position: absolute;

    right: 4px;
    top: 3px;

    width: 18px;
    height: 18px;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 0;

    border: none;
    border-radius: 50%;

    background: rgba(255,255,255,0.8);

    color: #555;

    font-size: 13px;
    font-weight: bold;

    cursor: pointer;
}

.delete-item:hover {
    background: #dc2626;
    color: white;
}

/* DRAG REORDER */

.list-item.dragging-item {
    opacity: 0.35;
}

.list-item.drag-over {
    outline: 2px dashed #555;
    outline-offset: 2px;
}

/* =========================================
   PLATE
========================================= */

.plate-panel {
    overflow-x: auto;
}

.plate-wrapper {
    display: flex;
    justify-content: center;
    overflow-x: auto;
    padding: 5px;
}

.plate {
    display: grid;

    grid-template-columns:
        25px repeat(12, 45px);

    grid-template-rows:
        22px repeat(8, 45px);

    gap: 4px;

    width: max-content;

    user-select: none;
}

/* ROW / COLUMN HEADERS */

.header {
    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 11px;
    font-weight: normal;
    color: #777;
}

/* WELL */

.well {
    width: 45px;
    height: 45px;

    border: 3px solid #bbb;
    border-radius: 50%;

    background: white;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    cursor: crosshair;

    text-align: center;

    overflow: hidden;

    padding: 3px;
}

.well.selected {
    box-shadow:
        0 0 0 2px #111,
        0 0 0 4px white;
}

/* WELL NUMBER */

.well-name {
    font-size: 6.5px;
    line-height: 7px;

    font-weight: normal;
    color: #aaa;

    flex-shrink: 0;
}

/* SAMPLE / GENE */

.well-sample,
.well-gene {
    width: 36px;

    line-height: 1;

    font-weight: bold;
    color: #111;

    white-space: nowrap;

    text-align: center;

    flex-shrink: 0;
}

/* =========================================
   SELECTION
========================================= */

.selection-info {
    margin-top: 12px;
    text-align: center;

    font-size: 13px;
    color: #666;
}

/* =========================================
   BUTTON BAR
========================================= */

.button-bar {
    display: flex;
    justify-content: center;
    gap: 10px;

    margin-top: 16px;

    flex-wrap: wrap;
}

.action-btn {
    padding: 9px 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.clear-btn {
    background: #f59e0b;
}

.download-btn {
    background: #059669;
    color: white;
}

.reset-btn {
    background: #dc2626;
    color: white;
}

/* =========================================
   LEGEND
========================================= */

.legend-container {
    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 20px;

    margin-top: 20px;
}

.legend h3 {
    margin-top: 0;
}

.legend-row {
    display: flex;
    align-items: center;

    margin: 6px 0;

    font-size: 13px;
    font-weight: bold;
}

.color-box {
    width: 18px;
    height: 18px;

    margin-right: 8px;

    border-radius: 4px;
}

.sample-color {
    background: white;

    border-width: 4px;
    border-style: solid;
}

/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 800px) {

    .top-panel,
    .experiment-grid,
    .legend-container {
        grid-template-columns: 1fr;
    }
}

/* Touch / mouse / Pencil rectangle selection */
.plate { position: relative; touch-action: none; -webkit-user-select: none; user-select: none; }
.plate .well { touch-action: none; -webkit-user-select: none; user-select: none; }

@media (max-width: 650px) {
    body { padding: 10px; }
    h1 { font-size: 21px; }
    .panel, .experiment-panel, .plate-panel, .legend { padding: 12px; }
    .plate-navigation { padding: 10px; gap: 8px; }
    .plate-nav-left { gap: 4px; }
    .plate-nav-btn { width: 34px; height: 38px; }
    .plate-counter { min-width: 78px; font-size: 12px; }
    .delete-plate-btn { padding: 9px 7px; font-size: 12px; }
    .plate-wrapper { justify-content: flex-start; }
    .plate { grid-template-columns: 16px repeat(12, 27px); grid-template-rows: 19px repeat(8, 27px); gap: 2px; }
    .well { width: 27px; height: 27px; border-width: 2px; padding: 1px; }
    .well-name { font-size: 5px; line-height: 5px; }
    .well-sample, .well-gene { width: 22px; }
    .header { font-size: 9px; }
    .well.selected { box-shadow: 0 0 0 1.5px #111; }
    .selection-info { overflow-wrap: anywhere; }
    .action-btn { min-height: 42px; }
}
@media (min-width:651px) and (max-width:900px) {
    body { padding: 14px; }
    .plate-wrapper { justify-content: flex-start; }
}

body { padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
button, .list-item { -webkit-tap-highlight-color: transparent; }

.app-tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0 18px; }
.app-tools button { border:1px solid #d1d5db; border-radius:7px; background:white; padding:9px 12px; color:#222; cursor:pointer; }
.app-tools .app-help { color:#666; font-size:12px; }
@media(max-width:650px) {
 body { padding:12px; }
 h1 { font-size:22px; }

 .plate-navigation { padding:10px; }

 .header { font-size:9px; }
 .action-btn { min-height:40px; }
}

/* Responsive PC/tablet/phone layout + zoom */
.plate-panel { min-width:0; overflow:hidden; }
.plate-wrapper { width:100%; min-width:0; overflow-x:auto; overflow-y:hidden; justify-content:flex-start; padding:3px 1px 7px; overscroll-behavior-x:contain; }
.plate { --well-size:45px; --well-gap:4px; --row-label-size:25px; --column-label-size:22px;
  width:max-content !important; min-width:0 !important;
  grid-template-columns:var(--row-label-size) repeat(12,var(--well-size)) !important;
  grid-template-rows:var(--column-label-size) repeat(8,var(--well-size)) !important;
  gap:var(--well-gap) !important; flex-shrink:0; }
.plate .well { width:var(--well-size) !important; height:var(--well-size) !important; aspect-ratio:auto !important;
  min-width:0 !important; padding:1px !important; border-width:clamp(1px, calc(var(--well-size) * .065), 3px) !important; }
.plate .well-name { font-size:clamp(4px,calc(var(--well-size)*.14),7px) !important; line-height:1.1 !important; }
.plate .well-sample,.plate .well-gene { width:calc(var(--well-size) - 5px) !important; max-width:calc(var(--well-size) - 5px) !important;
  min-width:0 !important; line-height:1.08; overflow:hidden; text-overflow:clip; }
.plate .header { font-size:clamp(8px,calc(var(--well-size)*.25),11px); }
.plate-zoom-bar { display:flex; justify-content:center; align-items:center; gap:6px; flex-wrap:wrap; margin:3px 0 9px; }
.plate-zoom-bar button { min-width:38px; min-height:34px; padding:5px 9px; background:#eff3f8; color:#222;
  border:1px solid #cdd5e0; border-radius:7px; font-size:15px; font-weight:600; cursor:pointer; }
.plate-zoom-bar button:active { background:#dbeafe; }
.plate-zoom-bar .zoom-fit { min-width:69px; font-size:12px; }
.plate-zoom-bar output { min-width:49px; font-size:12px; font-variant-numeric:tabular-nums; text-align:center; }
@media(max-width:650px) {
  body {padding:8px !important; font-size:12px;}
  .container {width:100%; min-width:0;}
  h1 {font-size:17px !important; margin:0 0 8px !important; line-height:1.2;}
  h2 {font-size:14px !important; margin:0 0 8px !important;}

  .field-group input,.field-group textarea {padding:7px 8px !important; font-size:13px !important;}
  .field-group textarea {min-height:38px !important; height:44px;}
  .top-panel {gap:9px !important; margin-bottom:9px !important;}
  .input-row {margin-bottom:6px !important;}
  .input-row input {padding:7px !important; font-size:13px;}
  .add-btn {padding:7px 10px !important; font-size:12px;}
  .list-item {min-height:27px !important; font-size:11px !important; padding:4px 23px 4px 8px !important;}
  .list {gap:4px !important;}
  .app-tools {margin:6px 0 9px !important; gap:5px !important;}
  .app-tools button {padding:7px 8px !important; font-size:11px;}
  .app-tools .app-help {font-size:10px !important;}
  .plate-panel h2 {margin-bottom:6px !important;}
  .plate-wrapper {padding:2px 0 5px !important;}
  .selection-info {font-size:10px !important; margin-top:6px !important; line-height:1.3;}
  .button-bar {margin-top:9px !important; gap:5px !important;}
  .action-btn {min-height:32px !important; padding:6px 8px !important; font-size:11px !important;}
  .legend-container {gap:9px !important; margin-top:9px !important;}
  .legend-row {font-size:11px !important; margin:4px 0 !important;}
}
/* Center the 96-well grid whenever it fits; preserve left-origin scrolling when zoomed. */
.plate-wrapper { justify-content: flex-start !important; }
.plate-wrapper > .plate { margin-inline: auto !important; }
.plate-zoom-bar, .selection-info, .button-bar { width: 100%; }

/* Three-column desktop workspace: Samples | Genes | centered plate */
.designer-workspace { display:grid; grid-template-columns:minmax(172px, 205px) minmax(172px, 205px) minmax(0,1fr); gap:14px; align-items:start; }
.designer-workspace > .top-panel { display:contents; }
.designer-workspace > .plate-panel { min-width:0; width:100%; }
.designer-workspace > .top-panel > .panel { min-width:0; padding:13px; }
.designer-workspace .input-row { gap:5px; }
.designer-workspace .input-row input { width:0; min-width:0; font-size:12px; padding:8px 6px; }
.designer-workspace .input-row button { flex:none; padding:7px 9px; }
.designer-workspace .list { display:flex; flex-direction:column; align-items:stretch; gap:5px; }
.designer-workspace .list-item { width:100%; min-width:0; min-height:33px; justify-content:flex-start; gap:7px; padding:5px 26px 5px 7px; overflow-wrap:anywhere; }
.designer-workspace .list-item > span:not(.item-order) { min-width:0; }
.designer-workspace .item-order { display:inline-flex; flex:0 0 23px; align-items:center; justify-content:center; align-self:center; font-size:11px; font-variant-numeric:tabular-nums; font-weight:bold; color:#475569; background:rgba(255,255,255,.75); border-radius:4px; padding:3px 1px; }
.designer-workspace .plate-wrapper > .plate { margin-inline:auto !important; }
@media (min-width:1200px) { .container {max-width:1550px;} }
@media (max-width:1050px) and (min-width:701px) { .designer-workspace {grid-template-columns:minmax(145px,175px) minmax(145px,175px) minmax(0,1fr);gap:9px;} .designer-workspace > .top-panel > .panel {padding:9px;} }
@media (max-width:700px) {
 .designer-workspace {display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:9px;}
 .designer-workspace > .top-panel {display:contents;}
 .designer-workspace > .plate-panel {grid-column:1/-1;}
 .designer-workspace > .top-panel > .panel {padding:9px;}
 .designer-workspace .list-item {font-size:11px;}
}
@media (max-width:370px) { .designer-workspace .input-row {flex-wrap:wrap;} .designer-workspace .input-row input {flex-basis:100%;} }

</style>
</head>


<body>

<div class="container">

<h1>qPCR 96-Well Plate Designer</h1>


<div class="app-tools">
<button type="button" onclick="exportProject()">프로젝트 백업 (.json)</button>
<button type="button" onclick="document.getElementById('projectImport').click()">백업 불러오기</button>
<input id="projectImport" type="file" accept=".json,application/json" hidden onchange="importProject(event)">

</div>
<!-- =====================================
     PLATE NAVIGATION
===================================== -->

<div class="plate-navigation">

    <div class="plate-nav-left">

        <button
            class="plate-nav-btn"
            onclick="previousPlate()"
            title="Previous Plate"
        >
            ‹
        </button>


        <div
            id="plateCounter"
            class="plate-counter"
        >
            Plate 1 / 1
        </div>


        <button
            class="plate-nav-btn"
            onclick="nextPlate()"
            title="Next Plate"
        >
            ›
        </button>


        <button
            class="plate-nav-btn add-plate-btn"
            onclick="addPlate()"
            title="Add Plate"
        >
            +
        </button>

    </div>


    <button
        id="deletePlateButton"
        class="delete-plate-btn"
        onclick="deleteCurrentPlate()"
    >
        Delete Plate
    </button>

</div>


<!-- =====================================
     EXPERIMENT INFORMATION
===================================== -->

<div class="experiment-panel">

    <h2>Experiment Information</h2>


    <div class="experiment-grid">

        <div class="field-group">

            <label for="experimentName">
                Experiment Name
            </label>

            <input
                id="experimentName"
                type="text"
                placeholder="Enter experiment name"
            >

        </div>


        <div class="field-group">

            <label for="experimentDetails">
                Details
            </label>

            <textarea
                id="experimentDetails"
                placeholder="Enter experiment details"
            ></textarea>

        </div>

    </div>

</div>


<!-- =====================================
     SAMPLE / GENE
===================================== -->

<div class="designer-workspace">
<div class="top-panel">


    <!-- SAMPLE -->

    <div class="panel">

        <h2>Samples</h2>


        <div class="input-row">

            <input
                id="sampleInput"
                placeholder="Sample name or comma-separated names"
            >


            <button
                class="add-btn"
                onclick="addSample()"
            >
                Add
            </button>

        </div>


        <div
            id="sampleList"
            class="list"
        ></div>

    </div>


    <!-- GENE -->

    <div class="panel">

        <h2>Genes</h2>


        <div class="input-row">

            <input
                id="geneInput"
                placeholder="Gene name or comma-separated names"
            >


            <button
                class="add-btn"
                onclick="addGene()"
            >
                Add
            </button>

        </div>


        <div
            id="geneList"
            class="list"
        ></div>

    </div>

</div>


<!-- =====================================
     PLATE
===================================== -->

<div class="plate-panel">

    <h2 id="plateTitle">
        96-Well Plate 1
    </h2>


    <div class="plate-zoom-bar" aria-label="Plate 확대 및 축소">
        <button type="button" id="zoomOut" aria-label="축소">−</button>
        <output id="plateZoomLabel" aria-live="polite">자동 맞춤</output>
        <button type="button" id="zoomIn" aria-label="확대">+</button>
        <button type="button" id="zoomFit" class="zoom-fit">화면 맞춤</button>
    </div>
    <div class="plate-wrapper">

        <div
            id="plate"
            class="plate"
        ></div>

    </div>


    <div
        id="selectionInfo"
        class="selection-info"
    >
        Selected Wells: None
    </div>


    <div class="button-bar">

        <button
            class="action-btn clear-btn"
            onclick="clearSelectedWells()"
        >
            Clear Selected Wells
        </button>


        <!--
            현재 보고 있는 Plate만 다운로드
        -->

        <button
            class="action-btn download-btn"
            onclick="downloadCurrentPlate()"
        >
            Download Image
        </button>


        <button
            class="action-btn reset-btn"
            onclick="resetPlate()"
        >
            Reset Plate
        </button>

    </div>

</div>


</div><!-- /designer-workspace -->


</div>


<script>

/* =========================================
   COLORS
========================================= */

const sampleColors = [

    "#e53935",
    "#1e88e5",
    "#43a047",
    "#8e24aa",
    "#fb8c00",
    "#00897b",
    "#3949ab",

];


const geneColors = [

    "#ffcdd2",
    "#bbdefb",
    "#c8e6c9",
    "#e1bee7",

/* =========================================
   WELL POSITION
========================================= */

function wellToPos(name) {

    return {

        row:
            rows.indexOf(
                name[0]
            ),

        col:
            parseInt(
                name.slice(1)
            ) - 1

    };
}


function posToWell(
    row,
    col
) {

    return (
        rows[row]
        +
        (col + 1)
    );
}


/* =========================================
   RECTANGLE SELECTION
========================================= */

function rectangleWellNames(start, end) {
    const a = wellToPos(start);
    const b = wellToPos(end);
    const result = new Set();
    for (let row = Math.min(a.row, b.row); row <= Math.max(a.row, b.row); row++) {
        for (let col = Math.min(a.col, b.col); col <= Math.max(a.col, b.col); col++) {
            result.add(posToWell(row, col));
        }
    }
    return result;
}

function selectRectangle(start, end, base = null) {
    const next = base ? new Set(base) : new Set();
    rectangleWellNames(start, end).forEach(name => next.add(name));
    selectedWells.clear();
    next.forEach(name => selectedWells.add(name));
    updatePlate();
}

function beginWellSelection(name, event) {
    event.preventDefault();
    dragging = true;
    selectionBase = new Set(selectedWells);

    if (event.shiftKey && selectionAnchor) {
        /* Shift: Excel-style anchored rectangular selection. */
        dragStart = selectionAnchor;
        selectionMode = (event.ctrlKey || event.metaKey) ? "add" : "replace";
        selectRectangle(dragStart, name, selectionMode === "add" ? selectionBase : null);
    } else if (event.ctrlKey || event.metaKey) {
        /* Ctrl/Cmd: toggle one well; dragging adds a region. */
        dragStart = name;
        selectionAnchor = name;
        selectionMode = "toggle";
        if (selectedWells.has(name)) selectedWells.delete(name);
        else selectedWells.add(name);
        updatePlate();
    } else {
        /* Original plain-click / rectangle-drag behavior. */
        dragStart = name;
        selectionAnchor = name;
        selectionMode = "replace";
        selectRectangle(name, name);
    }
}

function extendWellSelection(name) {
    if (!dragging || !dragStart) return;
    if (selectionMode === "toggle") {
        /* On Ctrl-drag, retain earlier selection and add dragged rectangle. */
        selectRectangle(dragStart, name, selectionBase);
    } else {
        selectRectangle(dragStart, name, selectionMode === "add" ? selectionBase : null);
    }
}

/* =========================================
   CREATE PLATE
========================================= */

function createPlate() {

    const plate =
        document.getElementById(
            "plate"
        );


    plate.innerHTML =
        "";


    /* TOP LEFT EMPTY CELL */

    plate.appendChild(

        document.createElement(
            "div"
        )

    );


    /* COLUMN NUMBERS */

    for (
        let col = 1;
        col <= 12;
        col++
    ) {

        const header =
            document.createElement(
                "div"
            );


        header.className =
            "header";


        header.textContent =
            col;


        plate.appendChild(
            header
        );
    }


    /* ROWS */

    for (
        let row = 0;
        row < 8;
        row++
    ) {

        const rowHeader =
            document.createElement(
                "div"
            );


        rowHeader.className =
            "header";


        rowHeader.textContent =
            rows[row];


        plate.appendChild(
            rowHeader
        );


        for (
            let col = 1;
            col <= 12;
            col++
        ) {

            const name =
                rows[row]
                +
                col;


            const well =
                document.createElement(
                    "div"
                );


            well.className =
                "well";


            well.dataset.well =
                name;


            well.innerHTML = `

                <div class="well-name">
                    ${name}
                </div>

                <div class="well-sample">
                </div>

                <div class="well-gene">
                </div>

            `;


            /* Keyboard modifiers are read only for Well selection.
               Existing Sample/Gene drag-and-drop reorder is untouched. */
            well.addEventListener("mousedown", event => {
                if (event.button !== 0) return;
                beginWellSelection(name, event);
            });
            well.addEventListener("mouseenter", () => extendWellSelection(name));

            plate.appendChild(
                well
            );
        }
    }
}

========================================= */

function addSample() {

    const input =
        document.getElementById(
            "sampleInput"
        );


    const names =
        input.value

            .split(",")

            .map(
                name =>
                    name.trim()
            )

            .filter(
                name =>
                    name !== ""
            );


    if (
        names.length === 0
    ) {

        return;
    }


    names.forEach(

        name => {

            const alreadyExists =
                samples.some(

                    item =>
                        item.name ===
                        name

                );


            if (
                alreadyExists
            ) {

                return;
            }


            samples.push({

                name:
                    name,

                color:
                    sampleColors[
                        samples.length
                        %
                        sampleColors.length
                    ]

            });

        }

    );


    input.value =
        "";


    renderSamples();

    renderLegend();
}

/* =========================================
   DELETE SAMPLE
========================================= */

function deleteSample(index) {

    const sample =
        samples[index];


    if (
        !confirm(
            `Delete sample "${sample.name}"?`
        )
    ) {

        return;
    }


    const deletedName =
        sample.name;


    samples.splice(
        index,
        1
    );


    /*
        Remove deleted Sample from
        ALL plates.
    */

    plates.forEach(

        plate => {

            Object.keys(
                plate.data
            ).forEach(

                well => {

                    if (
                        plate.data[well]
                            .sample
                        ===
                        deletedName
                    ) {

                        delete plate
                            .data[well]
                            .sample;
                    }


                    cleanEmptyWell(
                        plate,
                        well
                    );

                }

            );

        }

    );


    renderSamples();

    renderLegend();

    updatePlate();
}

/* =========================================

========================================= */

function cleanEmptyWell(
    plate,
    well
) {

    const data =
        plate.data[well];


    if (
        !data
    ) {

        return;
    }


    if (
        !data.sample
        &&
        !data.gene
    ) {

        delete plate.data[well];
    }
}


/* =========================================
   DRAG REORDER
========================================= */

function addDragEvents(
    item,
    type
) {

    item.addEventListener(

        "dragstart",

        event => {

            if (
                event.target
                    .classList
                    .contains(
                        "delete-item"
                    )
            ) {

                event.preventDefault();

                return;
            }


            dragType =
                type;


            dragIndex =
                Number(
                    item.dataset.index
                );


            item.classList.add(
                "dragging-item"
            );


            event.dataTransfer
                .effectAllowed =
                "move";

        }

    );


    item.addEventListener(

        "dragover",

        event => {

            if (
                dragType !==
                type
            ) {

                return;
            }


            event.preventDefault();


            item.classList.add(
                "drag-over"
            );

        }

    );


    item.addEventListener(

        "dragleave",

        () => {

            item.classList.remove(
                "drag-over"
            );

        }

    );


    item.addEventListener(

        "drop",

        event => {

            event.preventDefault();


            item.classList.remove(
                "drag-over"
            );


            if (
                dragType !==
                type
            ) {

                return;
            }


            const targetIndex =
                Number(
                    item.dataset.index
                );


            if (
                dragIndex === null
                ||
                dragIndex === targetIndex
            ) {

                return;
            }


            if (
                type ===
                "sample"
            ) {

                reorderArray(
                    samples,
                    dragIndex,
                    targetIndex
                );


                renderSamples();

            } else {

                reorderArray(
                    genes,
                    dragIndex,
                    targetIndex
                );


                renderGenes();
            }


            renderLegend();

        }

    );


    item.addEventListener(

        "dragend",

        () => {

            dragType =
                null;


            dragIndex =
                null;


            document
                .querySelectorAll(
                    ".list-item"
                )
                .forEach(

                    element => {

                        element.classList.remove(
                            "dragging-item",
                            "drag-over"
                        );

                    }

                );

        }

    );
}


function reorderArray(
    array,
    fromIndex,
    toIndex
) {

    const moved =
        array.splice(
            fromIndex,
            1
        )[0];


    array.splice(
        toIndex,
        0,
        moved
    );
}


/* =========================================
   AUTO-FIT SAMPLE / GENE TEXT
========================================= */

/*
    Names are NOT shortened with "...".

    Font size automatically decreases
    until the entire name fits.
*/

function fitTextToWell(
    element,
    text
) {

    element.textContent =
        text || "";


    if (
        !text
    ) {

        return;
    }


    let size =
        Math.min(8, Math.max(4, Math.round(element.clientWidth * .38)));


    element.style.fontSize =
        size + "px";


    while (
        element.scrollWidth > Math.max(12, element.clientWidth)
        &&
        size > 3
    ) {

        size -=
            0.25;


        element.style.fontSize =
            size + "px";
    }
}


/* =========================================
   UPDATE PLATE
========================================= */

function updatePlate() {

    const plateData =
        currentPlate().data;


    document
        .querySelectorAll(
            ".well"
        )
        .forEach(

            well => {

                const name =
                    well.dataset.well;


                const data =
                    plateData[name]
                    ||
                    {};


                /* SELECTION */

                well.classList.toggle(

                    "selected",

                    selectedWells.has(
                        name
                    )

                );


                /* TEXT */

                const sampleElement =
                    well.querySelector(
                        ".well-sample"
                    );


                const geneElement =
                    well.querySelector(
                        ".well-gene"
                    );


                fitTextToWell(
                    sampleElement,
                    data.sample || ""
                );


                fitTextToWell(
                    geneElement,
                    data.gene || ""
                );


                /* SAMPLE COLOR */

                const sample =
                    samples.find(

                        item =>
                            item.name
                            ===
                            data.sample

                    );


                well.style.borderColor =

                    sample
                    ?
                    sample.color
                    :
                    "#bbb";


                /* GENE COLOR */

                const gene =
                    genes.find(

                        item =>
                            item.name
                            ===
                            data.gene

                    );


                well.style.backgroundColor =

                    gene
                    ?
                    gene.color
                    :
                    "white";

            }

        );


    /* SELECTION INFO */

    const selected =
        Array.from(
            selectedWells
        );


    document
        .getElementById(
            "selectionInfo"
        )
        .textContent =

        selected.length

        ?
        (
            selected.length
            +
            " wells selected: "
            +
            selected.join(", ")
        )

        :
        "Selected Wells: None";
}

/* =========================================
   PNG FONT AUTO-FIT
========================================= */

function getCanvasFontSize(
    ctx,
    text,
    maxWidth,
    startSize,
    minSize
) {

    let size =
        startSize;


    while (
        size >
        minSize
    ) {

        ctx.font =
            `bold ${size}px Arial`;


        if (
            ctx.measureText(
                text
            ).width
            <=
            maxWidth
        ) {

            break;
        }


        size -=
            0.25;
    }


    return size;
}


/* =========================================
   WRAP DETAILS TEXT
========================================= */

function wrapTextLines(
    ctx,
    text,
    maxWidth
) {

    if (
        !text
    ) {

        return [];
    }


    const paragraphs =
        text.split(
            /\r?\n/
        );


    const lines =
        [];


    paragraphs.forEach(

        paragraph => {

            if (
                paragraph === ""
            ) {

                lines.push("");

                return;
            }


            let line =
                "";


            /*
                Character-based wrapping also
                works with Korean text.
            */

            for (
                const character
                of
                paragraph
            ) {

                const testLine =
                    line
                    +
                    character;


                if (
                    ctx.measureText(
                        testLine
                    ).width
                    >
                    maxWidth
                    &&
                    line
                ) {

                    lines.push(
                        line
                    );


                    line =
                        character;

                } else {

                    line =
                        testLine;
                }
            }


            if (
                line
            ) {

                lines.push(
                    line
                );
            }

        }

    );


    return lines;
}


/* =========================================
   CREATE PNG FOR SPECIFIC PLATE
========================================= */

function createPlateCanvas(
    plateObject,
    plateNumber
) {

    /*
        High-resolution output
    */

    const scale =
        2;


    const cell =
        76;


    const left =
        60;


    const radius =
        30;


    const width =
        left
        +
        12 * cell
        +
        35;


    /* -------------------------------------
       Calculate Details height
    ------------------------------------- */

    const tempCanvas =
        document.createElement(
            "canvas"
        );


    const tempCtx =
        tempCanvas.getContext(
            "2d"
        );


    tempCtx.font =
        "13px Arial";


    const detailLines =
        wrapTextLines(

            tempCtx,

            plateObject.details,

            width - 70

        );


    const detailLineHeight =
        18;


    const detailsHeight =

        detailLines.length

        ?
        detailLines.length
        *
        detailLineHeight

        :
        0;


    const infoBottom =
        75
        +
        detailsHeight;


    const plateTop =
        Math.max(

            125,

            infoBottom
            +
            45

        );


    const height =
        plateTop
        +
        8 * cell
        +
        45;


    /* -------------------------------------
       Canvas
    ------------------------------------- */

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        width
        *
        scale;


    canvas.height =
        height
        *
        scale;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.scale(
        scale,
        scale
    );


    /* WHITE BACKGROUND */

    ctx.fillStyle =
        "#ffffff";


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* =====================================
       EXPERIMENT NAME
    ===================================== */

    ctx.textAlign =
        "left";


    ctx.textBaseline =
        "middle";


    ctx.fillStyle =
        "#111";


    ctx.font =
        "bold 22px Arial";


    const title =

        plateObject.name

        ||
        `Plate ${plateNumber}`;


    ctx.fillText(
        title,
        35,
        35
    );


    /* =====================================
       DETAILS
    ===================================== */

    if (
        detailLines.length
    ) {

        ctx.fillStyle =
            "#555";


        ctx.font =
            "13px Arial";


        detailLines.forEach(

            (
                line,
                index
            ) => {

                ctx.fillText(

                    line,

                    35,

                    68
                    +
                    index
                    *
                    detailLineHeight

                );

            }

        );
    }


    /* =====================================
       SEPARATOR
    ===================================== */

    const separatorY =
        plateTop - 45;


    ctx.strokeStyle =
        "#ddd";


    ctx.lineWidth =
        1;


    ctx.beginPath();


    ctx.moveTo(
        35,
        separatorY
    );


    ctx.lineTo(
        width - 35,
        separatorY
    );


    ctx.stroke();


    /* =====================================
       COLUMN NUMBERS
    ===================================== */

    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillStyle =
        "#777";


    ctx.font =
        "13px Arial";


    for (
        let col = 0;
        col < 12;
        col++
    ) {

        ctx.fillText(

            String(
                col + 1
            ),

            left
            +
            col * cell
            +
            cell / 2,

            plateTop - 18

        );
    }


    /* =====================================
       ROW LETTERS
    ===================================== */

    for (
        let row = 0;
        row < 8;
        row++
    ) {

        ctx.fillText(

            rows[row],

            25,

            plateTop
            +
            row * cell
            +
            cell / 2

        );
    }


    /* =====================================
       WELLS
    ===================================== */

    for (
        let row = 0;
        row < 8;
        row++
    ) {

        for (
            let col = 0;
            col < 12;
            col++
        ) {

            const name =
                posToWell(
                    row,
                    col
                );


            const data =
                plateObject
                    .data[name]
                ||
                {};


            const sample =
                samples.find(

                    item =>
                        item.name
                        ===
                        data.sample

                );


            const gene =
                genes.find(

                    item =>
                        item.name
                        ===
                        data.gene

                );


            const x =
                left
                +
                col * cell
                +
                cell / 2;


            const y =
                plateTop
                +
                row * cell
                +
                cell / 2;


            /* GENE BACKGROUND */

            ctx.beginPath();


            ctx.arc(
                x,
                y,
                radius,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =

                gene

                ?
                gene.color

                :
                "#ffffff";


            ctx.fill();


            /* SAMPLE BORDER */

            ctx.lineWidth =
                5;


            ctx.strokeStyle =

                sample

                ?
                sample.color

                :
                "#bbbbbb";


            ctx.stroke();


            /* WELL NUMBER */

            ctx.fillStyle =
                "#aaa";


            ctx.font =
                "9px Arial";


            ctx.fillText(
                name,
                x,
                y - 15
            );


            /* =================================
               SAMPLE NAME
               Full name / no ellipsis
            ================================= */

            if (
                data.sample
            ) {

                const fontSize =
                    getCanvasFontSize(

                        ctx,

                        data.sample,

                        52,

                        10,

                        3

                    );


                ctx.fillStyle =
                    "#111";


                ctx.font =
                    `bold ${fontSize}px Arial`;


                ctx.fillText(

                    data.sample,

                    x,

                    y

                );
            }


            /* =================================
               GENE NAME
               Full name / no ellipsis
            ================================= */

            if (
                data.gene
            ) {

                const fontSize =
                    getCanvasFontSize(

                        ctx,

                        data.gene,

                        52,

                        10,

                        3

                    );


                ctx.fillStyle =
                    "#111";


                ctx.font =
                    `bold ${fontSize}px Arial`;


                ctx.fillText(

                    data.gene,

                    x,

                    y + 15

                );
            }

        }

    }


    return canvas;
}


/* =========================================
   SAFE FILE NAME
========================================= */

function safeFileName(
    name,
    plateNumber
) {

    let result =
        name.trim();


    if (
        !result
    ) {

        result =
            `Plate_${plateNumber}`;
    }


    result =
        result.replace(
            /[\\/:*?"<>|]/g,
            "_"
        );


    return result;
}


/* =========================================
   TRIGGER DOWNLOAD
========================================= */

function triggerDownload(
    canvas,
    filename
) {

    const link =
        document.createElement(
            "a"
        );


    link.download =
        filename;


    link.href =
        canvas.toDataURL(
            "image/png"
        );


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );
}


/* =========================================
   DOWNLOAD CURRENT PLATE ONLY
========================================= */

function downloadCurrentPlate() {

    /*
        IMPORTANT:

        Only the Plate currently displayed
        on screen is downloaded.
    */

    const plateObject =
        currentPlate();


    const plateNumber =
        currentPlateIndex + 1;


    const canvas =
        createPlateCanvas(

            plateObject,

            plateNumber

        );


    /*
        Example:

        Lung_qPCR_Plate_1.png
        Lung_qPCR_Plate_2.png
    */

    const filename =
        safeFileName(

            plateObject.name,

            plateNumber

        )
        +
        `_Plate_${plateNumber}.png`;


    triggerDownload(
        canvas,
        filename
    );
}

/* ========================================================
   Manual JSON backup / restore only (no automatic storage)
   ======================================================== */
function projectSnapshot() {
  return {version:1, samples, genes, plates, currentPlateIndex, nextPlateId};
}
function hydrateProject(data) {
  if (!data || !Array.isArray(data.samples) || !Array.isArray(data.genes) || !Array.isArray(data.plates) || !data.plates.length) throw new Error('Invalid project');
  const validPlates = data.plates.map((p,i) => ({
    id: Number.isFinite(p.id) ? p.id : i+1,
    name: typeof p.name === 'string' ? p.name : '',
    details: typeof p.details === 'string' ? p.details : '',
    data: p.data && typeof p.data === 'object' && !Array.isArray(p.data) ? p.data : {}
  }));
  samples = data.samples.filter(s => s && typeof s.name === 'string' && typeof s.color === 'string');
  genes = data.genes.filter(g => g && typeof g.name === 'string' && typeof g.color === 'string');
  plates = validPlates;
  currentPlateIndex = Math.max(0, Math.min(validPlates.length-1, Number(data.currentPlateIndex)||0));
  nextPlateId = Math.max(...plates.map(p=>p.id),0)+1;
}
function exportProject(){
  const blob = new Blob([JSON.stringify(projectSnapshot(), null, 2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement('a'); anchor.href=url; anchor.download='qPCR_Plate_Project.json';
  document.body.appendChild(anchor); anchor.click(); anchor.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function importProject(event){
  const file = event.target.files && event.target.files[0];
  if(!file)return;
  try{
    const data=JSON.parse(await file.text());
    if(!data || !Array.isArray(data.plates) || !Array.isArray(data.samples) || !Array.isArray(data.genes) || !data.plates.length) throw new Error('Invalid project');
    if(!confirm('현재 프로젝트를 백업 파일로 교체하시겠습니까?')) return;
    hydrateProject(data); selectedWells.clear();
    renderSamples();renderGenes();renderLegend();loadCurrentPlate();
  } catch(error) { alert('유효한 qPCR 프로젝트 JSON 파일이 아닙니다.'); }
  finally { event.target.value=''; }
}

/* Fit all twelve columns on a Galaxy S24-class phone, independent of viewport width.
   Zoom changes actual grid geometry, so rectangle hit testing remains accurate. */
const plateElement = document.getElementById('plate');
const plateWrapper = document.querySelector('.plate-wrapper');
const plateZoomLabel = document.getElementById('plateZoomLabel');
let zoomWellSize = null; // null = auto-fit
const ZOOM_MIN = 15;
const ZOOM_MAX = 82;
function fitWellSize() {
    // Container width, accounting for its horizontal padding and 12 column gaps.
    const css = getComputedStyle(plateWrapper);
    const available = plateWrapper.clientWidth - parseFloat(css.paddingLeft) - parseFloat(css.paddingRight) - 2;
    const gap = available < 600 ? 2 : 4;
    const rowLabel = available < 600 ? 15 : 25;
    return Math.max(ZOOM_MIN, Math.min(45, Math.floor((available - rowLabel - 12*gap) / 12)));
}
function setPlateZoom(size = zoomWellSize) {
    if (!plateWrapper || !plateElement) return;
    const autoSize = fitWellSize();
    const chosenSize = size === null ? autoSize : Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,Math.round(size)));
    const small = plateWrapper.clientWidth < 600;
    plateElement.style.setProperty('--well-size', chosenSize + 'px');
    plateElement.style.setProperty('--well-gap', (small ? 2 : 4) + 'px');
    plateElement.style.setProperty('--row-label-size', (small ? 15 : 25) + 'px');
    plateElement.style.setProperty('--column-label-size', (small ? 17 : 22) + 'px');
    plateZoomLabel.textContent = size === null ? '자동 맞춤' : Math.round(chosenSize/45*100) + '%';
    // Redraw fitted names for every zoom level.
    if (typeof updatePlate === 'function') updatePlate();
}
document.getElementById('zoomIn').addEventListener('click', () => {
    zoomWellSize = Math.min(ZOOM_MAX, (zoomWellSize ?? fitWellSize()) + 5);
    setPlateZoom();
});
document.getElementById('zoomOut').addEventListener('click', () => {
    zoomWellSize = Math.max(ZOOM_MIN, (zoomWellSize ?? fitWellSize()) - 5);
    setPlateZoom();
});
document.getElementById('zoomFit').addEventListener('click', () => {
    zoomWellSize = null;
    plateWrapper.scrollLeft = 0;
    setPlateZoom();
});
window.addEventListener('resize', () => setPlateZoom());
if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => {
    if (zoomWellSize === null) setPlateZoom();
}).observe(plateWrapper);

createPlate();

renderSamples();

renderGenes();

renderLegend();

loadCurrentPlate();
setPlateZoom();

</script>
